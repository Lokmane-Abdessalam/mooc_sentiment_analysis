services:

  # =========================
  # HADOOP NAMENODE
  # =========================
  namenode:
    image: apache/hadoop:3.4.1
    user: "root"
    container_name: mooc-namenode
    hostname: namenode
    command: ["/opt/hadoop/start-namenode.sh"]

    ports:
      - "9870:9870"
      - "9000:9000"

    volumes:
      - hdfs_namenode_data:/opt/hadoop/dfs/name:Z
      - ./hadoop-config/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro,Z
      - ./hadoop-config/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro,Z
      - ./hadoop-config/start-namenode.sh:/opt/hadoop/start-namenode.sh:ro,Z

    environment:
      HADOOP_CLUSTER_NAME: mooc-cluster

    networks:
      - bigdata


  # =========================
  # HADOOP DATANODE 1
  # =========================
  datanode:
    image: apache/hadoop:3.4.1
    user: "root"
    container_name: mooc-datanode
    hostname: datanode
    command: ["hdfs", "datanode"]

    ports:
      - "9864:9864"

    volumes:
      - hdfs_datanode_data:/opt/hadoop/dfs/data:Z
      - ./hadoop-config/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro,Z
      - ./hadoop-config/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro,Z

    environment:
      HADOOP_CLUSTER_NAME: mooc-cluster

    depends_on:
      - namenode

    networks:
      - bigdata


  # =========================
  # HADOOP DATANODE 2
  # =========================
  datanode-2:
    image: apache/hadoop:3.4.1
    user: "root"
    container_name: mooc-datanode-2
    hostname: datanode-2
    command: ["hdfs", "datanode"]

    ports:
      - "9865:9864"

    volumes:
      - hdfs_datanode_2_data:/opt/hadoop/dfs/data:Z
      - ./hadoop-config/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro,Z
      - ./hadoop-config/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro,Z

    environment:
      HADOOP_CLUSTER_NAME: mooc-cluster

    depends_on:
      - namenode

    networks:
      - bigdata


  # =========================
  # SPARK MASTER
  # =========================
  spark-master:
    build:
      context: .
      dockerfile: Dockerfile.spark

    container_name: mooc-spark-master
    hostname: spark-master

    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master

    ports:
      - "8080:8080"
      - "7077:7077"

    networks:
      - bigdata


  # =========================
  # SPARK WORKER 1
  # =========================
  spark-worker:
    build:
      context: .
      dockerfile: Dockerfile.spark

    container_name: mooc-spark-worker
    hostname: spark-worker

    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077

    depends_on:
      - spark-master

    ports:
      - "8081:8081"

    networks:
      - bigdata


  # =========================
  # SPARK WORKER 2
  # =========================
  spark-worker-2:
    build:
      context: .
      dockerfile: Dockerfile.spark

    container_name: mooc-spark-worker-2
    hostname: spark-worker-2

    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077

    depends_on:
      - spark-master

    ports:
      - "8082:8081"

    networks:
      - bigdata


  # =========================
  # JUPYTER
  # =========================
  jupyter:
    build:
      context: .
      dockerfile: Dockerfile.jupyter

    image: mooc-jupyter:spark-4.2.0
    container_name: mooc-jupyter
    user: "root"
    ports:
      - "8888:8888"

    environment:
      JUPYTER_ENABLE_LAB: "yes"
      CHOWN_HOME: "yes"           # <-- Tell startup script to fix ownership
      CHOWN_HOME_OPTS: "-R"       # <-- Apply recursively to all files

    volumes:
      - ./notebooks:/home/jovyan/work/notebooks:Z
      - ./spark/jobs:/home/jovyan/work/jobs:Z
      - jupyter_pip_cache:/home/jovyan/.local:Z

    depends_on:
      - spark-master
      - namenode

    networks:
      - bigdata


# =========================
# NETWORKS
# =========================
networks:
  bigdata:
    driver: bridge


# =========================
# VOLUMES
# =========================
volumes:
  hdfs_namenode_data:
  hdfs_datanode_data:
  hdfs_datanode_2_data:
  jupyter_pip_cache:
